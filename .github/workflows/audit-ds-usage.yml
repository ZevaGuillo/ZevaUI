# RF-11 Mecanismo A: the reusable workflow a CONSUMER repository calls to
# report which design-system components it uses, and at which version.
#
#   jobs:
#     ds-usage:
#       uses: ZevaGuillo/ZevaUI/.github/workflows/audit-ds-usage.yml@v1
#       with:
#         ds-ref: v1
#
# `workflow_call` only. There is no `push`/`pull_request`/`workflow_dispatch`
# trigger on purpose: this file exists to be invoked BY other repositories, and
# a trigger here would make it run against this repository on every event with
# no caller and no meaning. This repo audits itself through the `audit-self`
# job in ci.yml, which calls this same workflow.
#
# `v1` tag status (RF-12 rollout). The caution this comment used to encode
# was earned twice over. Every claim below is a measured probe run on
# `zevaui-consumer-probe`, not a reading of the docs:
#
#   permissions block            caller           result
#   ---------------------------- ---------------- -----------------------------
#   contents+id-token            (none)           startup_failure, 2s
#   contents+id-token            grants id-token  success
#   contents only                (none)           success, submission skipped
#   contents only                grants id-token  success, but NO token minted
#                                                 -> registry never written
#   none (current)               (none)           success, submission skipped
#   none (current)               grants id-token  success, token minted, POST
#                                                 reached production
#
# The first shape broke consumers who never wanted submission. The second
# started fine and silently made submission impossible, which only surfaced
# by checking the REGISTRY after a green run rather than trusting the green.
# Fire-and-tolerate means a green run proves nothing about submission on its
# own; read the registry.
#
# `v1` stays where it is until the write path is confirmed end to end against
# this revision. Designed behavior is not the same as verified behavior, and
# this file's history now has three places where those disagreed (ADR-0009's
# RF-UAW14, and both rows above).
name: DS usage audit

on:
  workflow_call:
    inputs:
      app:
        description: >-
          Identity this report is labelled with. Defaults to the CALLER's
          github.repository, which is only correct when the repository holds a
          single app — so leaving it empty while pointing working-directory at
          a subdirectory is refused rather than silently mislabelled (D3).
        required: false
        type: string
        default: ""
      working-directory:
        description: >-
          Subdirectory of the caller's checkout to scan. Defaults to the whole
          repository. Anything resolving outside the checkout is refused.
        required: false
        type: string
        default: "."
      ds-ref:
        description: >-
          The design-system revision whose scanner runs. Defaults to `main` so
          adding this workflow costs one block and no decisions.

          Pin it to a tag when a report has to be comparable over time: the
          report records which DS version the consumer uses, not which scanner
          produced it, so on the default two identical-looking runs can mean
          different things once the scanner on `main` moves. That trade is
          recorded in ADR-0009 D3.
        required: false
        type: string
        default: main
      registry-url:
        description: >-
          Adoption registry endpoint to submit this report to (RF-12), opt-in.

          Empty — the default — means no network call happens at all: the run
          behaves exactly as it does today (RF-AR06 scenario 1). Set it to
          enable submission, in addition to the artifact upload above, not
          instead of it. Submission is fire-and-tolerate (RF-AR06 scenario 2):
          a registry that is down, slow, or misconfigured costs this job one
          bounded submission attempt and a `::warning::` annotation, never a
          failed run. This value is only ever read through `env:`, never
          interpolated into a `run:` body, and is always upgraded to `https:`
          before any request leaves this job (see the submission step below).

          Setting this requires one more line in YOUR job, because this
          workflow deliberately does not request identity on your behalf:

            permissions:
              contents: read
              id-token: write

          Forgetting it is not fatal — the token step tolerates its own
          failure and the run warns instead of submitting — but nothing will
          ever reach the registry until it is there.
        required: false
        type: string
        default: ""

# THERE IS DELIBERATELY NO `permissions:` BLOCK HERE. Do not add one.
#
# Both ways of writing it were measured against a real consumer, and both
# break a real consumer:
#
#   permissions:                 -> `startup_failure` in 2s for every caller
#     contents: read                that did not grant id-token. A reusable
#     id-token: write               workflow requesting more than its caller
#                                   holds is refused outright. There is no
#                                   silent intersection. This broke consumers
#                                   who never wanted submission at all.
#
#   permissions:                 -> starts fine, but a caller that DOES grant
#     contents: read                id-token still cannot get one. The called
#                                   workflow's block decides what its jobs
#                                   actually receive, not merely a ceiling,
#                                   so `core.getIDToken()` fails with
#                                   "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL"
#                                   and RF-AR06 submission can never work.
#
# With no block, jobs inherit exactly what the caller granted, and both
# consumers work: one adds nothing, starts, and skips submission; the other
# grants `id-token: write` and submits.
#
# The cost is real and accepted: a caller that grants broad permissions passes
# them in. This file is written so that costs nothing — it uses no write
# scope anywhere, and both checkouts set `persist-credentials: false`, so the
# caller's token is not left on disk for the scanner to reach.
#
# A consumer opting into submission adds this to its own job, next to `uses:`:
#
#     permissions:
#       contents: read
#       id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # The CALLER's repository, at the root of the workspace. This is the tree
      # that gets scanned.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The design system, alongside it. `.zevaui-audit` sits INSIDE the
      # consumer's workspace, which means a scan with working-directory "."
      # walks right into it — and this repository's own storybook imports
      # Alert, Button, Card, Dialog and more. Measured: a consumer using only
      # Button got back Alert, Button, Dialog.
      #
      # So this path is not cosmetic. It must stay identical to
      # WORKFLOW_DS_CHECKOUT_DIR in packages/audit/scripts/walk-source-tree.js,
      # which is what prunes it. Change one without the other and every
      # consumer's report silently gains our components.
      - uses: actions/checkout@v4
        with:
          repository: ZevaGuillo/ZevaUI
          ref: ${{ inputs.ds-ref }}
          path: .zevaui-audit
          persist-credentials: false

      # Explicit version, not `node-version-file`. The caller's repository is
      # what sits at the workspace root, so an `.nvmrc` found there would be
      # THEIRS — and the scanner's runtime is our contract, not theirs. Ours
      # lives at `.zevaui-audit/.nvmrc` and reads `22`; this tracks it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No `pnpm install`. The scanner is four dependency-free Node modules
      # that import nothing outside `node:` and each other, so a checkout is
      # the whole install. That is a property worth keeping: it is why this
      # workflow cannot execute a consumer's lockfile.
      - name: Audit design-system usage
        env:
          AUDIT_APP: ${{ inputs.app }}
          AUDIT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: node .zevaui-audit/packages/audit/scripts/audit-usage.js > ds-usage-report.json

      # Inputs reach the shell through `env:`, never through `${{ }}` inside a
      # `run:` body. An input is caller-controlled text; interpolated into the
      # script it would be executed, not quoted. `tr -c` then reduces it to the
      # character set artifact names allow, so a nested path cannot smuggle a
      # separator into the name either.
      - id: name
        name: Derive a collision-free artifact name
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          slug=$(printf '%s' "$WORKING_DIRECTORY" | tr -c 'A-Za-z0-9._-' '-')
          [ "$slug" = "-" ] && slug=root
          printf 'value=ds-usage-report-%s\n' "$slug" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: ds-usage-report.json
          if-no-files-found: error

      # Everything from here down is the opt-in submission path (D6, RF-AR06)
      # and runs ONLY when the caller set registry-url — the artifact above
      # already exists either way, so a consumer who never opts in gets the
      # identical run they got before this input existed.
      #
      # The audience passed to core.getIDToken() is registry-url itself: no
      # separate, fixed service-audience string is provisioned yet (tracked
      # as an open question until the registry is actually deployed), and an
      # OIDC audience naming the exact resource being called is a standard,
      # defensible default in the meantime. `env:`, not string interpolation
      # into `script:` — the same shell-injection rule applies to splicing
      # caller-controlled text into embedded JS source.
      # `continue-on-error` because this workflow no longer requests
      # `id-token: write` itself (see the permissions block above): a consumer
      # that sets registry-url but forgets to grant the permission in its own
      # job makes `core.getIDToken()` throw here. That is a misconfiguration,
      # and fire-and-tolerate (D6) says a misconfigured registry costs a
      # warning, never the build. The step tolerates its own failure, the
      # output below comes back empty, and submit-report.js already warns and
      # returns on an empty token.
      - name: Mint an OIDC token for the registry audience
        if: inputs.registry-url != ''
        id: registry-token
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: return await core.getIDToken(process.env.REGISTRY_URL)
        env:
          REGISTRY_URL: ${{ inputs.registry-url }}

      # registry-url reaches submit-report.js through env:, exactly like
      # AUDIT_APP/AUDIT_WORKING_DIRECTORY above — never interpolated into
      # this `run:` line. submit-report.js re-parses it with `new URL()` and
      # forces `https:` before it ever opens a connection (Threat Matrix:
      # argument/env composition), and this step's own contract is fire-and-
      # tolerate: submit-report.js always exits 0, so a dead registry cannot
      # fail this job.
      - name: Submit usage report to the registry (opt-in)
        if: inputs.registry-url != ''
        env:
          REGISTRY_URL: ${{ inputs.registry-url }}
          REGISTRY_OIDC_TOKEN: ${{ steps.registry-token.outputs.result }}
          REGISTRY_REPORT_PATH: ds-usage-report.json
        run: node .zevaui-audit/packages/audit/scripts/submit-report.js
