name: Visual baselines

# Regenerates the committed screenshot baselines on Linux and pushes them back
# to the branch this run was dispatched against.
#
# `workflow_dispatch` ONLY, deliberately. This job must NEVER run
# automatically in response to a failing visual gate: re-baselining on red
# deletes the very gate it exists to serve. There is no `push`, no `schedule`,
# no `workflow_run` and no `repository_dispatch` trigger here, and adding one
# is the change to argue hardest against.
#
# Why the baselines are Linux-only by construction: @vitest/browser resolves
# the reference filename with a platform suffix (`-chromium-linux` on this
# runner, `-chromium-win32` on a Windows contributor's machine), so a locally
# authored PNG is invisible to CI rather than conflicting with it, and CI then
# fails on a missing reference. Inter is named in the tokens but never
# embedded (no @font-face or woff anywhere in the repo), so another OS
# re-rasterises every glyph — far beyond the 38px a real one-letter regression
# costs, which is why no threshold can paper over the difference. See
# ADR-0008.
#
# Authorisation is GitHub-native: dispatching requires repo write, so this
# grants nobody authority they did not already have, and there is no stored
# credential to manage.
#
# Forks: a fork PR's head branch lives in the fork, where this repo's
# GITHUB_TOKEN cannot write and `ref` cannot address it. A maintainer lands
# regenerated baselines as a follow-up commit instead. Self-hosting Inter is
# the structural fix that would eventually relieve this; it is deferred.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to regenerate baselines on and push back to.
        required: true
        type: string

# Least privilege: the baseline commit is the only write this job performs.
permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ inputs.ref }}
  # Never cancel a run mid-push.
  cancel-in-progress: false

jobs:
  baselines:
    # The same pin as ci.yml, and it has to be: this workflow AUTHORS the PNGs
    # that ci.yml then verifies. `ubuntu-latest` migrates to Ubuntu 26.04
    # gradually between 2026-10-19 and 2026-11-19, so leaving either side of
    # that contract floating means a dispatch could commit baselines
    # rasterised on one image against a gate that runs on another.
    #
    # The push at the end of this job does not re-trigger CI, so nobody would
    # find out here — the failure would surface on the next unrelated pull
    # request, as somebody else's red. The font reasoning lives in ci.yml and
    # ADR-0008 rather than being restated here.
    runs-on: ubuntu-24.04
    steps:
      # v5, deliberately not v6 or v7. v6.0.0's one functional change is
      # "persist creds to a separate file" — and `persist-credentials: true`
      # below is load-bearing here, because the final step pushes the
      # regenerated baselines with GITHUB_TOKEN. That is the exact mechanism v6
      # rewrote. It very likely still works; this workflow's failure mode is
      # "regenerated baselines never land", which is QUIET, so it is not the
      # place to find out. v5 changes nothing about it and is actively
      # maintained.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # The push at the end reuses GITHUB_TOKEN.
          persist-credentials: true
      # Same SHA bump as ci.yml: v4.3.0 -> v4.4.0 is one line of action.yml
      # (`node20` -> `node24`) with a byte-identical dist.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      # --ignore-scripts matches ci.yml: pnpm 10 already blocks dependency
      # lifecycle scripts absent an onlyBuiltDependencies allowlist, this repo
      # declares none, and no workspace package has an install hook. It closes
      # the finding without changing what runs.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Same cache key as ci.yml, so both workflows share one Chromium
      # download instead of paying ~300MB twice.
      # v5 is the first cache major on Node 24; identical input surface to
      # v4.3.0, so the shared key above is untouched.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # `--filter`, matching ci.yml: playwright is a devDependency of
      # apps/storybook, not of the workspace root, so a bare `pnpm exec` from the
      # root cannot find its bin under pnpm-isolated node_modules.
      #
      # SonarCloud flags this line under githubactions:S6505, "Omitting
      # --ignore-scripts allows lifecycle scripts to run during package
      # installation". It is a false positive: `playwright install` downloads
      # browser binaries, and the real `pnpm install` ten lines up already
      # carries --ignore-scripts. It is handled by marking the issue
      # false-positive in SonarCloud, not by working around it here.
      #
      # Measured, so nobody pays for it twice: moving this command into an
      # apps/storybook package script and calling it with `pnpm run` DOES
      # clear the rule — and it also hung this step inside `apt-get update`
      # for 37 and 17 minutes across two consecutive runs, against a 3m27s
      # baseline for the line as written. Reverted. The mechanism was never
      # established; the logs pointed at an unreachable Ubuntu mirror, which
      # does not explain why only the `pnpm run` form ever hung. If you try it
      # again, watch the runner, not just the scanner.
      #
      # timeout-minutes: 10 matches ci.yml, where the measurements behind the
      # number live — kept in one place rather than restated here. What is
      # specific to THIS workflow: it matters more. A dispatch is something a
      # maintainer kicks off and walks away from, so when this step stalls
      # there is nobody watching the tab to cancel it.
      - timeout-minutes: 10
        run: pnpm --filter @zevaui/storybook exec playwright install --with-deps chromium
      - run: pnpm turbo run build

      # Actions sets CI=true on every step, and under CI=true a missing
      # reference fails and writes nothing — so `--update` alone would not
      # seed anything on a first run. The variable has to be cleared for this
      # one step, and only this one.
      - name: Generate baselines
        run: pnpm --filter @zevaui/storybook run test:visual:update
        env:
          CI: ""

      # Load-bearing, and it runs BEFORE the commit. A push made with
      # GITHUB_TOKEN does not re-trigger `on: push` or `on: pull_request`, so
      # without this step the baselines would land completely unverified and
      # the next unrelated PR would silently inherit them. Verifying here
      # proves the exact property CI depends on — that the references hold
      # under CI=true — on the exact runner that produced them. If it fails,
      # the job fails and nothing is pushed.
      - name: Verify the generated baselines hold
        id: verify
        run: pnpm --filter @zevaui/storybook run test:visual
        env:
          CI: "true"

      # ADR-0018 V0, wired into THIS workflow too, because this is where the
      # evidence is actually needed. `DateField.stories.tsx > Focused Segment`
      # failed the verify step above twice in a row at exactly 260 pixels,
      # which blocked the baseline commit both times. The same-count repeat is
      # the interesting part: it points at state that differs between the
      # generate pass and the verify pass rather than at noise, and the
      # standing hypothesis is react-aria's interaction modality, which is
      # GLOBAL document state that decides whether `[data-focus-visible]`
      # draws its outline. None of that can be confirmed without the image.
      #
      # BOTH paths, and the second one is the one people forget. When the
      # verify step fails the job stops before the commit, so the reference
      # this run just generated exists ONLY on the runner — it is not in git
      # and cannot be fetched later. Uploading the attachments alone would
      # hand you a diff with nothing to compare it against.
      #
      # No step summary here, unlike ci.yml. Copying that bash into a second
      # workflow is how two copies start drifting, and reviewers already
      # flagged the inline block as the thing to extract rather than
      # duplicate. A maintainer who dispatched this run is already looking at
      # it; the artifact is what they cannot otherwise get.
      - name: Upload the visual diffs and the generated references
        if: failure() && steps.verify.conclusion == 'failure'
        # v6, not v5: v5's action.yml still declares `using: 'node20'` despite
        # its "supports Node v24.x" release title. v6.0.0 is the first that
        # actually runs on node24 — and `include-hidden-files` below is
        # unchanged there, which is the one input this step cannot lose. The
        # full argument lives next to the same bump in ci.yml.
        uses: actions/upload-artifact@v6
        with:
          name: visual-baselines-diffs-${{ github.run_id }}
          path: |
            apps/storybook/.vitest-attachments/**
            apps/storybook/stories/__screenshots__/**
          # Same defect as ci.yml, never yet observed here because this step
          # has not failed since it was added — and it would have failed
          # WORSE. Dotfiles are excluded by default since upload-artifact
          # v4.4, so `__screenshots__` would upload while
          # `.vitest-attachments` — the diff, the entire reason this step
          # exists — was dropped. The artifact would still appear, merely
          # incomplete, which hides the bug far better than the empty upload
          # that exposed it in ci.yml (run 36511293563).
          include-hidden-files: true
          # `warn`, matching ci.yml: a verify failure that wrote no diff at all
          # is a real outcome, and turning it into a second failure would bury
          # the first.
          if-no-files-found: warn
          retention-days: 7

      - name: Commit and push if the baselines changed
        # `ref` reaches the shell through the environment, never through
        # ${{ }} interpolation into a command string, so a crafted branch name
        # is data here and not script.
        env:
          TARGET_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          # The checkout resolved `ref` once; nothing since should have moved
          # HEAD. Asserted rather than assumed, so this job can never build a
          # commit on one ref and push it as another.
          actual_ref="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$actual_ref" != "$TARGET_REF" ]; then
            echo "::error::HEAD is on '$actual_ref' but this run was dispatched for '$TARGET_REF'."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Scoped to the baseline PNGs only — never `commit -a`, so nothing
          # else the build happened to touch can ride along. The gate
          # fixtures' own seeded screenshots are gitignored and stay out.
          #
          # The literal directory, not a `**/__screenshots__` glob: measured
          # against a real seeded run, both the plain and the `:(glob)` form
          # match ZERO files, because git's `**/` requires at least one
          # intervening path component and @vitest/browser writes the
          # directory flat beside the story files
          # (stories/__screenshots__/<Story>.stories.tsx/*.png). If a story
          # ever moves into a subfolder this pathspec stops matching, git add
          # exits nonzero, and `set -e` fails the job — loudly, which is the
          # right direction: a silently empty commit would look like
          # "baselines already current".
          git add -- "apps/storybook/stories/__screenshots__"

          # A run that changes nothing is a valid, successful outcome: it
          # means the committed baselines were already current.
          if git diff --cached --quiet; then
            echo "Baselines unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "chore(visual): update screenshot baselines"

          # Explicit refspec, never --force. If the branch moved while this
          # job ran, the push is rejected, the job fails, and the maintainer
          # re-dispatches — a force push here would silently discard whatever
          # landed in between.
          git push origin "HEAD:refs/heads/$TARGET_REF"
