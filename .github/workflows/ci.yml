name: CI

on:
  pull_request:
    # An explicit allowlist of BASE branches, not every PR. The filter matches
    # a PR's target; every change in this repo now lands sequential-to-main
    # (each slice targets `main` directly), so `main` is the only entry.
    branches:
      - main
  push:
    # Only main. A stack branch's own pushes are already covered by its pull
    # request run; triggering on both just pays for a second Chromium install.
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      # --ignore-scripts is belt-and-braces here, not a behaviour change: pnpm 10
      # already blocks dependency lifecycle scripts unless allowlisted via
      # onlyBuiltDependencies, this repo declares no such allowlist, and no
      # workspace package has an install/prepare hook. Verified before adding.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Chromium is ~300MB. Key the cache on the lockfile so it is reused until
      # the resolved Playwright version actually changes.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # --with-deps installs OS packages, which the cache cannot carry, so it runs
      # every time; the browser download itself is what the cache skips.
      # `--filter`, not a bare `pnpm exec`: playwright is a devDependency of
      # apps/storybook, not of the workspace root, so under pnpm's isolated
      # node_modules the root has no `playwright` bin to run. Every CI run since
      # this step landed died here with ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL,
      # which means the suite below it has never actually executed in CI.
      #
      # timeout-minutes bounds a step that HANGS rather than fails: it reaches
      # the Ubuntu apt mirrors, and when one stalls it simply sits there. Every
      # legitimate run measured finished within 3m27s; two stalled ones sat at
      # 37 and 17 minutes before a human cancelled them. Without a step timeout
      # the job runs to GitHub's 360-minute default instead.
      #
      # 10 is ~3x that slowest legitimate run. Safe for the cache above:
      # actions/cache has no `save-always` here, so it does not write on job
      # failure, and a timeout mid-download cannot persist a half-written
      # Chromium under the lockfile key.
      - timeout-minutes: 10
        run: pnpm --filter @zevaui/storybook exec playwright install --with-deps chromium
      - run: pnpm turbo run lint typecheck test build size
      - run: node -e "import('@zevaui/constraints').then(m => { if (typeof m.validateTheme !== 'function') process.exit(1) })"
        working-directory: packages/constraints
      - run: pnpm --filter @zevaui/storybook run test:a11y-gate
      - run: pnpm --filter @zevaui/components run size:gate
      # A raw step, not a turbo task: the gate mutates the fixture tree at
      # runtime (plants and removes a decoy under __fixtures__/consumer/
      # node_modules), and that side effect must never be memoised by
      # turbo's cache (RF-UAW12).
      - run: pnpm --filter @zevaui/audit run audit:gate
      # RF-AR08: not a turbo task, because it is not owned by any one
      # package — it scans the WHOLE of packages/* for tenant-identity leaks
      # against a denylist maintained under apps/dashboard.
      - run: node scripts/assert-no-tenant-names.js
      # The two visual gates are negative fixtures: each seeds its own
      # baseline at run time, so both are self-contained and need nothing
      # committed to the repo. The first proves the comparison catches a
      # change on a normally-rendered component; the second proves it on the
      # portalled path, where an unmodified capture would pass while
      # asserting nothing.
      - run: pnpm --filter @zevaui/storybook run test:visual-gate
      - run: pnpm --filter @zevaui/storybook run test:visual-overlay-gate
      # The positive gate, and the only step here that compares against the 38
      # REAL component baselines rather than a planted defect. Everything above
      # proves the mechanism has teeth; this is the one that actually notices
      # when Button or Dialog changes.
      #
      # Its precondition is now met, which is why it is wired at last: the 38
      # `-chromium-linux` baselines were generated by visual-baselines.yml
      # against `main`, self-verified under CI=true on the same runner that
      # produced them, and committed alongside this step being enabled. Their
      # measured frame and why it is Linux-only both live in ADR-0008.
      #
      # It stayed unwired until then on purpose: a run red between merges
      # teaches people to ignore the gate, and the PR4 gatekeeper called that
      # window a hard blocker rather than something to document. The same rule
      # applies going forward — whoever deletes or invalidates the baselines
      # unwires this step in the same change, rather than leaving CI failing
      # for everyone else.
      #
      # The step NAME carries the recovery path deliberately: a failing check
      # shows its name, not this comment, and the one thing the person staring
      # at red needs to know is which workflow regenerates the baselines.
      - name: "Visual regression vs the committed baselines (to refresh them: dispatch visual-baselines.yml)"
        id: visual
        run: pnpm --filter @zevaui/storybook run test:visual
      # ADR-0018 V0. Until this step existed the gate was a bare red/green
      # light: @vitest/browser writes actual+diff under
      # apps/storybook/.vitest-attachments/, .gitignore blocks that path as
      # debris, and so the one artefact that says WHAT changed died with the
      # runner. Whoever read the PR had to reproduce locally to see it.
      #
      # Scoped to `steps.visual.conclusion`, not a bare `failure()`: the two
      # negative gates above are ASSERTED to fail internally, their harness
      # swallows that and exits 0, and a job that went red on any earlier step
      # has no diff to carry. Only this step failing is evidence worth keeping.
      #
      # `warn`, not `error`: a failure caused by an ABSENT baseline under
      # CI=true writes no diff at all — measured, and the reason Windows
      # cannot author baselines (ADR-0008). Escalating that to a second
      # failure would bury the precise error under a misleading one.
      - name: Upload the visual diffs
        if: failure() && steps.visual.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          # Fixed, never derived from story or test names: upload-artifact
          # rejects `":<>|*?` and newlines, and a story title may hold any of
          # them. The run id already makes it unique.
          name: visual-diffs-${{ github.run_id }}
          path: apps/storybook/.vitest-attachments/**
          if-no-files-found: warn
          # Evidence about one run, not an archive. A diff nobody downloaded
          # inside a week is a diff whose branch has already moved on.
          retention-days: 7
      # An artifact has NO embeddable image URL — the download is an
      # authenticated zip — so the summary can name the failures and link the
      # run, never show them. Inline images need hosting of their own and a
      # separate security decision (ADR-0018 P4, deferred as V2).
      #
      # Runs even when the upload found nothing, because that case is itself
      # worth naming: zero diffs means the run never reached a pixel
      # comparison, which rules out a changed pixel but NOT much else. The
      # guard is `steps.visual.conclusion == 'failure'`, which is true for any
      # nonzero exit, so the honest message enumerates the candidates instead
      # of asserting one — a reader sent to dispatch visual-baselines.yml over
      # what was really a browser crash has been sent to the wrong place.
      - name: Summarise the visual diffs
        if: failure() && steps.visual.conclusion == 'failure'
        shell: bash
        run: |
          # Mirrors the `cell()` precedent in packages/audit/scripts/audit-usage.js:
          # an unescaped `|` closes a cell early and a bare CR or LF forges a whole
          # extra row. These values come from filenames this repo controls, so
          # escaping them is belt-and-braces — the same call that precedent makes.
          cell() {
            local value=${1//|/\\|}
            printf '%s' "${value//[$'\r\n']/ }"
          }
          shopt -s globstar nullglob
          diffs=(apps/storybook/.vitest-attachments/**/*-diff-*.png)
          {
            echo "## Visual regression"
            echo
            if [ ${#diffs[@]} -eq 0 ]; then
              echo "The run wrote **no diff**, so it never reached a pixel comparison."
              echo "That rules out a changed pixel. It does not say which of these it was —"
              echo "read the step log to tell them apart:"
              echo
              echo "- A **missing baseline**: under \`CI=true\` a missing reference fails without"
              echo "  writing one. Dispatch \`visual-baselines.yml\` to generate it."
              echo "- The run **died before comparing**: a story or build error, a browser that"
              echo "  failed to launch, an out-of-memory kill. Refreshing baselines fixes none"
              echo "  of these."
            else
              echo "${#diffs[@]} diff(s):"
              echo
              echo "| Story | Test |"
              echo "|---|---|"
              for diff in "${diffs[@]}"; do
                # .vitest-attachments/stories/<Story>.stories.tsx/<Test>-1-diff-<platform>.png
                # — the parent directory names the story file, the basename the test.
                story=${diff%/*}
                shot=${diff##*/}
                printf '| %s | %s |\n' "$(cell "${story##*/}")" "$(cell "${shot%-diff-*.png}")"
              done
              echo
              echo "Download \`visual-diffs-${{ github.run_id }}\` from this run's artifacts."
              echo "If the change is intended, refresh the baselines: dispatch \`visual-baselines.yml\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # RF-UAW13: this repository is the first consumer of its own reusable
  # workflow. `audit:gate` above already proves the SCANNER produces the right
  # report — but it runs the script directly, so it proves nothing about the
  # workflow that consumers actually invoke: the double checkout, the pinned
  # Node, the env wiring, the artifact upload. This job is the only place those
  # are exercised, and it fails the same way a consumer's would.
  #
  # It targets the committed fixture consumer rather than this repo's own
  # source, so the artifact has a known-correct answer to be checked against
  # (expected-report.json) instead of a number nobody can verify by eye.
  #
  # Runs in parallel with `ci`, not after it: it is independent evidence about
  # the workflow, and gating it behind the whole suite would only delay the
  # signal without making it more trustworthy.
  audit-self:
    uses: ./.github/workflows/audit-ds-usage.yml
    with:
      app: zevaui-fixture-consumer
      working-directory: packages/audit/__fixtures__/consumer
      # Passed explicitly even though `ds-ref` now defaults to `main`
      # (ADR-0009 D3), and that is the whole point: on the default this job
      # would audit MAIN's scanner while claiming to test the one in this pull
      # request. The change under review has to be the change that runs.
      #
      # The branch head, not `github.sha`: on a pull_request event the latter
      # is the ephemeral merge commit, which the DS checkout inside the called
      # workflow cannot resolve by SHA. Same-repo branches only — a fork PR
      # would not find this ref in the base repository, and that limitation is
      # named in ADR-0009 rather than papered over here.
      ds-ref: ${{ github.event.pull_request.head.sha || github.sha }}
