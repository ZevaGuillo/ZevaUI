name: CI

on:
  pull_request:
    # An explicit allowlist of BASE branches, not every PR. The filter matches
    # a PR's target, so while the visual-gate work is delivered as a stack,
    # only the bottom PR targets `main` — the other four target each other and
    # would get no `ci` check at all. The qvb globs exist for exactly that
    # window and should be dropped once the chain lands.
    branches:
      - main
      - "feat/qvb-**"
      - "docs/qvb-**"
  push:
    # Only main. A stack branch's own pushes are already covered by its pull
    # request run; triggering on both just pays for a second Chromium install.
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      # --ignore-scripts is belt-and-braces here, not a behaviour change: pnpm 10
      # already blocks dependency lifecycle scripts unless allowlisted via
      # onlyBuiltDependencies, this repo declares no such allowlist, and no
      # workspace package has an install/prepare hook. Verified before adding.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Chromium is ~300MB. Key the cache on the lockfile so it is reused until
      # the resolved Playwright version actually changes.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The command lives in apps/storybook's package.json, the package that
      # actually declares playwright — same shape as the test:a11y-gate call
      # below, and one home for a line both workflows need.
      #
      # `--filter` is still required: under pnpm's isolated node_modules the
      # workspace root has no `playwright` bin at all. Every CI run before that
      # was fixed died here with ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL, which
      # means the suite below it never executed.
      #
      # The OS packages --with-deps pulls cannot be cached, so that part runs
      # every time; the browser download is what the cache above skips.
      - run: pnpm --filter @zevaui/storybook run playwright:browsers
      - run: pnpm turbo run lint typecheck test size
      - run: node -e "import('@zevaui/constraints').then(m => { if (typeof m.validateTheme !== 'function') process.exit(1) })"
        working-directory: packages/constraints
      - run: pnpm --filter @zevaui/storybook run test:a11y-gate
      - run: pnpm --filter @zevaui/components run size:gate
      # The two visual gates are negative fixtures: each seeds its own
      # baseline at run time, so both are self-contained and need nothing
      # committed to the repo. The first proves the comparison catches a
      # change on a normally-rendered component; the second proves it on the
      # portalled path, where an unmodified capture would pass while
      # asserting nothing.
      - run: pnpm --filter @zevaui/storybook run test:visual-gate
      - run: pnpm --filter @zevaui/storybook run test:visual-overlay-gate
      # DELIBERATELY NOT WIRED YET — `run test:visual`, the positive gate over
      # the 38 real baselines, lands in the same commit as the generated
      # Linux baselines themselves, not before. Adding it here today would
      # make every run red until someone dispatches visual-baselines.yml, and
      # this project already rejected exactly that trade once: the PR4
      # gatekeeper called a "CI goes red until a later phase lands" window a
      # hard blocker requiring a fix, not documentation. A gate that cries
      # wolf between merges is a gate people learn to ignore.
