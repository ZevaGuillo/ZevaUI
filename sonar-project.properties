# Read by SonarCloud Automatic Analysis. No scanner runs in CI; this file is the only place
# analysis scope is declared, which is why it explains itself rather than just listing globs.

# The project key and organization are not repeated here: the GitHub App binding already owns
# them, and a stale copy would break the analysis rather than configure it.

# STORY FILES ARE FIXTURES, NOT LOGIC, and CPD cannot tell the difference.
#
# Every state a markable control can be in gets its own story, because one story is one screenshot
# baseline in the visual gate. `Checkbox` and `Switch` therefore both declare `Disabled`,
# `ReadOnly`, `Invalid`, `InvalidSelected` and the rest, and CPD reads those parallel declarations
# as a 33-line clone — enough to put new-code duplication at 7.4% against a 3% gate.
#
# Sharing them would be worse than the duplication it removes. Storybook indexes stories by named
# export, so a shared factory still needs one export per story per file and saves little; what it
# would really do is COUPLE the two components' visual matrices, so adding a state to the helper
# would silently mint baselines for every component using it. The states each control supports are
# a per-component fact — `Switch` has `Required` and `Invalid` only because it is built on
# SwitchField, and `Checkbox` has `Indeterminate`, which `Switch` cannot have at all.
#
# Scoped to duplication alone: stories stay in scope for every other rule, bugs and a11y included.
sonar.cpd.exclusions=**/*.stories.tsx
