# THE FILENAME IS THE CONFIGURATION. SonarCloud runs here as Automatic Analysis
# (there is no Sonar step in any workflow — the GitHub App analyses each push
# and pull request), and Automatic Analysis reads `.sonarcloud.properties` and
# IGNORES `sonar-project.properties` outright. This file was called
# `sonar-project.properties` for one full round and every setting in it was
# silently discarded: the duplication gate kept failing at 22.8% while the
# exclusion below sat in the repository looking correct. A scanner-based setup
# would be the other way round, so renaming this file back would re-break it.
#
# Second constraint, equally silent: Automatic Analysis reads this file from
# the repository's DEFAULT BRANCH. An exclusion added on a feature branch does
# not apply to that branch's own pull-request analysis. It has to land on
# `main` first.
#
# Deliberately no `sonar.projectKey` / `sonar.organization`: under Automatic
# Analysis those are bound on SonarCloud's side, and asserting a guessed value
# here could detach the project rather than configure it. This file exists for
# the one exclusion below and nothing else.

# Duplication is measured as a DENSITY — duplicated lines over new lines — and
# on the gate-teeth scripts that ratio reports the opposite of the truth.
#
# Measured, not assumed: extracting the shared harness into
# @zevaui/config/gate-harness cut assert-visual-overlay-fails.js from 223 lines
# to 61 and its sibling from 225 to 53. Absolute duplication fell hard. The
# reported density went the other way, 9.1% -> 22.8%, because the denominator
# shrank faster than the numerator.
#
# What Sonar still counts is each script's `runScreenshotGate({...})` call: a
# declarative block whose SHAPE is identical and whose every VALUE differs —
# different fixture, config, tag, seed and mismatch values, and different
# prose explaining what a failure means. Collapsing those into one
# flag-parameterised script would clear the metric by removing the one thing
# that makes a red gate actionable: each script naming its own planted fixture
# and what letting it through would cost.
#
# So this exclusion covers duplication ONLY, and only the gate-teeth scripts
# (two on `main` today, four once the visual-gate chain lands). Bugs,
# vulnerabilities, code smells and coverage are all still measured on them.
sonar.cpd.exclusions=**/scripts/assert-*.js
