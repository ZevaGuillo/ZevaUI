# THE FILENAME IS THE CONFIGURATION. SonarCloud runs here as Automatic
# Analysis (there is no Sonar step in any workflow — the GitHub App analyses
# each push and pull request), and Automatic Analysis reads
# `.sonarcloud.properties` and IGNORES `sonar-project.properties` outright.
# This file carried the wrong name for one full round and every setting in it
# was discarded in silence — no error, no warning, just a gate that stayed red
# while the config sat here looking correct. A scanner-based setup is the
# other way round, so renaming this file back would re-break it.
#
# Second constraint, equally silent: Automatic Analysis reads this file from
# the repository's DEFAULT BRANCH. A setting added on a feature branch does
# not apply to that branch's own pull-request analysis. It has to land on
# `main` first.
#
# Deliberately no `sonar.projectKey` / `sonar.organization`: under Automatic
# Analysis those are bound on SonarCloud's side, and asserting a guessed value
# here could detach the project rather than configure it.
#
# The one setting below is the first to use this file for real. The audit
# fixtures under packages/audit/__fixtures__/ are deliberately pathological
# source — duplicated imports (S3863/S7763), decoy declarations — because
# they are the must-find cases the scanner's tests assert against. Sonar
# reading them as product code reports ~10 issues whose "fix" would destroy
# exactly what the fixtures prove. Triage: observation #180, 2026-08-20.
#
# Per the traps above: this takes effect only after landing on `main`, and
# the first analysis after that is what verifies it — check that the
# S3863/S7763 findings inside __fixtures__/ are gone before trusting it.
sonar.exclusions=packages/audit/__fixtures__/**
#
# It previously carried `sonar.cpd.exclusions=**/scripts/assert-*.js`, added
# to silence a 22.8% duplication reading on the visual gate scripts. That
# exclusion was removed, for two independent reasons:
#
#   1. It should no longer be needed. The 22.8% came from 31 duplicated
#      lines in ONE file — apps/storybook/scripts/assert-visual-overlay-
#      fails.js, at 50% of itself — and extracting
#      apps/storybook/scripts/run-visual-gate.js removed that duplication
#      at the source. Deliberately phrased as an expectation and not a
#      result: PR #3 turned green while this exclusion was still in place,
#      so that run cannot separate the refactor's effect from the
#      exclusion's. Removing the exclusion IS the experiment, and the first
#      analysis after this lands is what settles it.
#   2. It was never proven to work. The number did not move by a single
#      decimal across an analysis that definitely read this file, which is
#      not the behaviour of an exclusion that is being applied.
#
# Reaching for an exclusion here should stay a last resort, and one that is
# verified against a real analysis rather than assumed.
